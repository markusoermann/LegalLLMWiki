# In ~/.codex/config.toml einfügen (oder projektweit in .codex/config.toml).
# Voraussetzung: Zotero-MCP-Plugin in Zotero installiert -> nativer HTTP-Endpoint auf 127.0.0.1:23120 (siehe 03-zotero-mcp.md).
# Filesystem-Server: PFAD anpassen.

[mcp_servers.zotero]
url = "http://127.0.0.1:23120/mcp"

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/PFAD/ZU/DEINEM/VAULT"]
